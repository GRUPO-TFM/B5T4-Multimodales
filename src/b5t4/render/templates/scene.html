<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  :root{--bg:#F6F1E8;--ink:#1B1F3B;--accent:#19C37D;--muted:#8E8BA6;--soft:#DDD9EC;--warn:#E0564B;--card:#fff}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);
    font-family:"Carlito","DejaVu Sans","FreeSans",sans-serif;color:var(--ink)}
  .stage{position:absolute;inset:0}
  .scene{position:absolute;inset:0;opacity:0}
  .chrome{position:absolute;inset:0;pointer-events:none}
  .brand{position:absolute;left:72px;top:48px;background:var(--ink);color:#fff;font-weight:700;
    font-size:30px;padding:14px 26px;border-radius:14px;letter-spacing:.5px}
  .brand b{color:var(--accent)}
  .tick{position:absolute;right:72px;top:48px;font-size:30px;font-weight:700;color:var(--muted);
    border:3px solid var(--soft);padding:12px 24px;border-radius:14px;background:#fff}
  .tick:empty{display:none}
  .progress{position:absolute;left:0;bottom:0;height:10px;background:var(--accent);width:0}
  .source{position:absolute;left:72px;bottom:40px;font-size:24px;color:var(--muted)}
  .sky{position:absolute;left:0;right:0;bottom:0;height:420px;opacity:.9}
  /* title */
  .kicker{position:absolute;left:72px;top:230px;font-size:44px;color:var(--muted);font-weight:700;letter-spacing:4px}
  .title{position:absolute;left:72px;top:300px;font-size:124px;font-weight:700;line-height:1.02;width:1500px}
  .subtitle{position:absolute;left:72px;top:600px;font-size:52px;color:var(--ink);width:1300px}
  .subtitle span{background:var(--accent);color:#fff;padding:6px 18px;border-radius:12px}
  /* kpi */
  .h2{position:absolute;left:72px;top:180px;font-size:64px;font-weight:700}
  .cards{position:absolute;left:72px;top:330px;display:flex;gap:48px}
  .card{background:var(--card);border-radius:28px;padding:48px 56px;width:860px;height:460px;
    box-shadow:0 24px 60px rgba(27,31,59,.08);position:relative}
  .card .lab{font-size:36px;color:var(--muted);font-weight:700}
  .card .num{font-size:clamp(80px,150px,150px);font-weight:700;margin-top:8px;line-height:1}
  .card .num small{font-size:60px;color:var(--muted);font-weight:700;margin-left:12px}
  .card .vs{font-size:36px;color:var(--muted);margin-top:18px}
  .pill{display:inline-block;background:var(--accent);color:#fff;font-weight:700;font-size:40px;
    padding:10px 26px;border-radius:40px;margin-top:22px}
  /* bars */
  .chart{position:absolute;left:72px;top:300px;width:1776px;height:620px}
  .bar{position:absolute;bottom:90px;width:300px;border-radius:18px 18px 6px 6px;background:var(--soft)}
  .bar.actual{background:var(--ink)}
  .bar.guide{background:var(--accent)}
  .bar.consensus{background:repeating-linear-gradient(135deg,var(--soft) 0 14px,#fff 14px 24px);border:4px solid var(--soft)}
  .bar .v{position:absolute;top:-70px;left:0;right:0;text-align:center;font-size:52px;font-weight:700}
  .bar .l{position:absolute;bottom:-80px;left:-40px;right:-40px;text-align:center;font-size:32px;color:var(--muted);font-weight:700}
  .axis{position:absolute;left:0;right:0;bottom:90px;height:4px;background:var(--soft)}
  .callout{position:absolute;right:72px;top:190px;background:var(--ink);color:#fff;font-size:40px;font-weight:700;
    padding:16px 30px;border-radius:16px}
  .callout b{color:var(--accent)}
  /* bullets */
  .items{position:absolute;left:72px;top:320px;width:1776px}
  .item{display:flex;align-items:center;gap:36px;background:#fff;border-radius:24px;padding:30px 44px;margin-bottom:26px;
    box-shadow:0 18px 50px rgba(27,31,59,.07);font-size:40px;line-height:1.25}
  .item .ic{width:92px;height:92px;border-radius:22px;background:var(--accent);color:#fff;display:flex;align-items:center;
    justify-content:center;font-size:48px;font-weight:700;flex:none}
  /* compare */
  .rows{position:absolute;left:72px;top:330px;width:1776px}
  .row{margin-bottom:70px}
  .row .lab{font-size:44px;font-weight:700;margin-bottom:18px;display:flex;justify-content:space-between}
  .row .lab span:last-child{color:var(--muted)}
  .track{height:72px;background:#fff;border-radius:36px;overflow:hidden;box-shadow:inset 0 0 0 4px var(--soft)}
  .fill{height:100%;background:var(--ink);border-radius:36px;width:0}
  .fill.hot{background:var(--accent)}
  .chip{position:absolute;left:72px;top:780px;background:#fff;border:4px solid var(--accent);color:var(--ink);
    font-size:40px;font-weight:700;padding:18px 34px;border-radius:50px}
  /* close */
  .stats{position:absolute;left:72px;top:330px;display:flex;gap:40px}
  .stat{background:#fff;border-radius:28px;padding:40px 48px;width:560px;box-shadow:0 24px 60px rgba(27,31,59,.08)}
  .stat .lab{font-size:32px;color:var(--muted);font-weight:700}
  .stat .val{font-size:110px;font-weight:700;line-height:1.05;margin-top:6px}
  .disc{position:absolute;left:72px;top:690px;width:1500px;font-size:30px;color:var(--muted);line-height:1.35}
  .disc b{color:var(--warn)}
  /* Onboarding: datos estructurados, texto escapado y relaciones explícitas. */
  .scene.onboarding{background:#f5f2ed;color:#172b39}
  .onboarding .ob-title{position:absolute;left:80px;top:190px;width:1760px;font-size:64px;line-height:1.12;font-weight:700}
  .ob-grid{position:absolute;left:80px;top:335px;width:1760px;display:grid;grid-template-columns:1fr 1fr;gap:28px}
  .ob-card{background:white;border-radius:22px;padding:30px 34px;border-top:6px solid #b32932;min-height:205px;box-shadow:0 16px 40px #172b3910;position:relative}
  .ob-label{font-size:35px;font-weight:700;line-height:1.15}.ob-detail{font-size:29px;line-height:1.28;margin-top:16px;color:#435d6d;overflow-wrap:anywhere}
  .ob-grid.count-5,.ob-grid.count-6,.ob-grid.count-7{grid-template-columns:repeat(3,1fr)}
  .count-5 .ob-card,.count-6 .ob-card,.count-7 .ob-card{padding:24px 26px}
  .count-5 .ob-label,.count-6 .ob-label,.count-7 .ob-label{font-size:30px}
  .count-5 .ob-detail,.count-6 .ob-detail,.count-7 .ob-detail{font-size:25px}
  .ob-grid.orgchart{left:330px;width:1260px;top:295px;grid-template-columns:1fr;gap:30px}
  .orgchart .ob-card{min-height:0;padding:18px 32px;text-align:center}.orgchart .ob-detail{margin-top:8px;font-size:28px}
  .orgchart .ob-card:not(:last-child):after{content:'↓';position:absolute;left:calc(50% - 12px);bottom:-33px;font-size:34px;color:#b32932}
  .ob-grid.flow{grid-template-columns:repeat(2,1fr);counter-reset:steps}.flow .ob-card{padding-left:92px}
  .flow .ob-card:before{counter-increment:steps;content:counter(steps);position:absolute;left:26px;top:30px;width:46px;height:46px;border-radius:50%;background:#172b39;color:white;text-align:center;font-size:30px;font-weight:700}
  .ob-grid.timeline .ob-card{border-top:0;border-left:7px solid #b32932}
  body.onboarding-video .brand{background:#172b39}body.onboarding-video .progress{background:#b32932}
  body.onboarding-video .source{left:80px;bottom:34px;font-size:20px;max-width:1760px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
</style>
<style>__V2_CSS__</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="chrome">
  <div class="brand" id="brand">Market<b>Brief</b></div>
  <div class="tick" id="tick"></div>
  <div class="source" id="source"></div>
  <div class="progress" id="progress"></div>
</div>
__V2_LIBS__
<script>__V2_JS__</script>
<script>
const SB = __SB__; const TL = __TL__;
const stage = document.getElementById('stage');
const ease = x => 1 - Math.pow(1 - Math.max(0, Math.min(1, x)), 3);
const clamp01 = x => Math.max(0, Math.min(1, x));
const fmt = (v, d) => v.toLocaleString('es-ES', {minimumFractionDigits: d, maximumFractionDigits: d});
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const onboarding = sc => sc.data.layout === 'onboarding' || ['orgchart','people','flow','timeline'].includes(sc.kind);
const onboardingV2 = sc => sc.data.layout === 'onboarding_v2';
const skyline = (c) => {
  // simple vector skyline, drawn once from a seed so it is deterministic
  let x = 0, parts = [];
  const h = [160, 260, 200, 340, 180, 300, 240, 390, 210, 280, 170, 330, 230, 290, 190, 360, 220, 250];
  for (let i = 0; i < h.length; i++) {
    const w = 90 + (i * 37) % 60;
    parts.push(`<rect x="${x}" y="${420 - h[i]}" width="${w}" height="${h[i]}" rx="6" fill="${c}" opacity="${0.35 + (i % 3) * 0.12}"/>`);
    for (let r = 0; r < Math.floor(h[i] / 48); r++) for (let k = 0; k < Math.floor(w / 30) - 1; k++)
      parts.push(`<rect x="${x + 14 + k * 30}" y="${420 - h[i] + 18 + r * 48}" width="14" height="20" rx="2" fill="#fff" opacity=".5"/>`);
    x += w + 18;
  }
  return `<svg class="sky" viewBox="0 0 ${x} 420" preserveAspectRatio="xMidYMax slice">${parts.join('')}</svg>`;
};

// ---------- build DOM for each scene once ----------
const scenes = SB.scenes.map((sc, i) => {
  const el = document.createElement('div'); el.className = 'scene'; el.id = sc.id;
  const d = sc.data;
  if (onboardingV2(sc)) {
    el.classList.add('onboarding-v2'); stage.appendChild(el);
    const animation = window.onboardingV2.build(el, {...d,kind:sc.kind}, TL.scenes[i]);
    return {sc,el,tl:TL.scenes[i],animation};
  }
  if (onboarding(sc)) {
    el.classList.add('onboarding');
    el.innerHTML = `<div class="ob-title">${esc(d.title)}</div><div class="ob-grid ${esc(sc.kind)} count-${d.items.length}">${d.items.map(it => `<div class="ob-card"><div class="ob-label">${esc(it.label)}</div><div class="ob-detail">${esc(it.detail)}</div></div>`).join('')}</div>`;
    stage.appendChild(el);
    return {sc, el, tl: TL.scenes[i]};
  }
  if (sc.kind === 'title') el.innerHTML = `${skyline('#C9C4E3')}<div class="kicker">${d.kicker}</div>
      <div class="title">${d.title}</div><div class="subtitle"><span>${d.subtitle}</span></div>`;
  if (sc.kind === 'kpi') el.innerHTML = `<div class="h2">${d.title || 'Lo publicado frente a lo esperado'}</div><div class="cards">${d.cards.map(c => `
      <div class="card"><div class="lab">${c.label}</div><div class="num" style="font-size:${(c.text||'').length > 9 ? 110 : 150}px"><span class="n">${c.value === undefined ? (c.text || '') : '0'}</span><small>${c.suffix || ''}</small></div>
      <div class="vs">${c.vs || ''}</div>${c.delta ? `<div class="pill">${c.delta}</div>` : ''}</div>`).join('')}</div>`;
  if (sc.kind === 'bars') {
    const max = Math.max(...d.bars.map(b => b.value)) * 1.15;
    el.innerHTML = `<div class="h2">${d.title}</div>${d.callout ? `<div class="callout">${d.callout}</div>` : ''}
      <div class="chart"><div class="axis"></div>${d.bars.map((b, j) => `
      <div class="bar ${b.style}" style="left:${(1776 - d.bars.length * 300 - (d.bars.length - 1) * 120) / 2 + j * 420}px" data-h="${(b.value / max) * 500}"><div class="v">${fmt(b.value, 1)}</div><div class="l">${b.label}</div></div>`).join('')}</div>`;
  }
  if (sc.kind === 'bullets') el.innerHTML = `<div class="h2">${d.title}</div><div class="items">${d.items.map(it => `
      <div class="item"><div class="ic">${it.icon}</div><div>${it.text}</div></div>`).join('')}</div>`;
  if (sc.kind === 'compare') el.innerHTML = `<div class="h2">${d.title}</div><div class="rows">${d.rows.map(r => `
      <div class="row"><div class="lab"><span>${r.label}</span><span>${r.fmt}</span></div><div class="track"><div class="fill ${r.hot ? 'hot' : ''}" data-w="${(r.value / r.max) * 100}"></div></div></div>`).join('')}</div>
      <div class="chip">${d.chip}</div>`;
  if (sc.kind === 'close') el.innerHTML = `${skyline('#C9C4E3')}<div class="h2">${d.title}</div><div class="stats">${d.stats.map(s => `
      <div class="stat"><div class="lab">${s.label}</div><div class="val" style="font-size:${s.value.length > 8 ? 76 : 110}px">${s.value}</div></div>`).join('')}</div>
      <div class="disc"><b>Aviso.</b> ${d.disclaimer}</div>`;
  stage.appendChild(el);
  return {sc, el, tl: TL.scenes[i]};
});
document.getElementById('tick').textContent = SB.scenes[0].data.ticker || '';
if (SB.brand) document.getElementById('brand').textContent = SB.brand;
if (SB.scenes.every(onboarding)) document.body.classList.add('onboarding-video');
if (SB.scenes.every(onboardingV2)) {
  document.body.classList.add('onboarding-v2-video');
  document.getElementById('brand').classList.add('andbank-logo');
  document.getElementById('brand').innerHTML = `<img alt="Andbank Private Bankers" src="${esc(SB.logo_url)}">`;
  gsap.ticker.sleep();
}

// ---------- per-frame render(t) ----------
function render(t) {
  document.getElementById('progress').style.width = (clamp01(t / TL.total) * 1920) + 'px';
  scenes.forEach(({sc, el, tl, animation}) => {
    const lt = t - tl.start, p = lt / tl.duration;
    const on = lt >= 0 && lt < tl.duration;
    el.style.opacity = on ? Math.min(ease(lt / 0.35), ease((tl.duration - lt) / 0.3)) : 0;
    if (onboardingV2(sc)) {
      animation.seek(Math.max(0, Math.min(tl.duration, lt)), true);
      if (on) document.getElementById('source').textContent = sc.data.source || '';
      return;
    }
    if (!on) return;
    document.getElementById('source').textContent = sc.data.source ? 'Fuente: ' + sc.data.source : (sc.data.sources || '');
    const d = sc.data;
    const slide = (node, t0, dur, dy = 40) => { const e = ease((lt - t0) / dur); node.style.opacity = e; node.style.transform = `translateY(${(1 - e) * dy}px)`; };
    if (onboarding(sc)) {
      slide(el.querySelector('.ob-title'), 0.05, 0.4, 15);
      el.querySelectorAll('.ob-card').forEach((card, j) => slide(card, 0.2 + j * 0.3, 0.5, 28));
      return;
    }
    if (sc.kind === 'title') {
      slide(el.querySelector('.kicker'), 0.1, 0.5); slide(el.querySelector('.title'), 0.3, 0.7, 60); slide(el.querySelector('.subtitle'), 1.0, 0.6);
      el.querySelector('.sky').style.transform = `translateY(${(1 - ease(lt / 1.2)) * 120}px)`;
    }
    if (sc.kind === 'kpi') el.querySelectorAll('.card').forEach((c, j) => {
      slide(c, 0.2 + j * 0.5, 0.6, 60);
      const k = d.cards[j]; if (k.value !== undefined) c.querySelector('.n').textContent = fmt(k.value * ease((lt - 0.5 - j * 0.5) / 1.3), k.decimals);
      const pill = c.querySelector('.pill'); if (pill) { const e = ease((lt - 2.0 - j * 0.5) / 0.35); pill.style.opacity = e; pill.style.transform = `scale(${0.6 + 0.4 * e})`; }
    });
    if (sc.kind === 'bars') {
      el.querySelectorAll('.bar').forEach((b, j) => { const e = ease((lt - 0.4 - j * 0.55) / 0.7); b.style.height = (b.dataset.h * e) + 'px'; b.querySelector('.v').style.opacity = ease((lt - 0.9 - j * 0.55) / 0.3); b.querySelector('.l').style.opacity = 1; });
      const co = el.querySelector('.callout'); if (co) slide(co, 3.4, 0.5, -30);
    }
    if (sc.kind === 'bullets') el.querySelectorAll('.item').forEach((it, j) => { const e = ease((lt - 0.3 - j * 1.4) / 0.6); it.style.opacity = e; it.style.transform = `translateX(${(1 - e) * -80}px)`; });
    if (sc.kind === 'compare') {
      el.querySelectorAll('.fill').forEach((f, j) => { f.style.width = (f.dataset.w * ease((lt - 0.4 - j * 1.1) / 1.0)) + '%'; });
      slide(el.querySelector('.chip'), 2.8, 0.5);
    }
    if (sc.kind === 'close') {
      el.querySelectorAll('.stat').forEach((s, j) => slide(s, 0.3 + j * 0.5, 0.6, 60));
      slide(el.querySelector('.disc'), 2.6, 0.6, 20);
      el.querySelector('.sky').style.transform = `translateY(${(1 - ease(lt / 1.2)) * 120}px)`;
    }
  });
}
window.render = render;
</script>
</body>
</html>
